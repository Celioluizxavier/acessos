<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Acesso restrito</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px}
  .card{width:100%;max-width:380px;background:#1e293b;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{margin:0 0 4px;font-size:1.4rem}
  p.sub{margin:0 0 20px;color:#94a3b8;font-size:.9rem}
  label{display:block;font-size:.85rem;margin:14px 0 6px;color:#cbd5e1}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:1rem}
  input:focus{outline:2px solid #3b82f6;border-color:#3b82f6}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#3b82f6;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:16px;padding:12px;border-radius:8px;font-size:.9rem;line-height:1.4}
  .msg.info{background:#1e3a5f}
  .msg.erro{background:#5f1e1e}
  .msg.aviso{background:#5f4a1e}
  .msg.ok{background:#1e5f3a}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <h1>🔐 Acesso restrito</h1>
  <p class="sub">Informe suas credenciais para continuar.</p>
  <form id="formLogin" autocomplete="on">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button id="btnEntrar" type="submit">Entrar</button>
  </form>
  <button id="btnContinuar" type="button" hidden>Continuar</button>
  <div id="mensagem" class="msg" role="alert" aria-live="polite" hidden></div>
</main>

<script src="crypto-utils.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  'use strict';
  var PROTEGIDA = Auth.CONFIG.PAGINA_PROTEGIDA;

  // Já está logado? Vai direto para a página.
  if (Auth.sessaoAtiva()) { location.replace(PROTEGIDA); return; }

  var form = document.getElementById('formLogin');
  var btn = document.getElementById('btnEntrar');
  var btnContinuar = document.getElementById('btnContinuar');
  var msg = document.getElementById('mensagem');

  // Somente textContent: nada vindo do arquivo é interpretado como HTML.
  function mostrar(tipo, texto) {
    msg.className = 'msg ' + tipo;
    msg.textContent = texto;
    msg.hidden = false;
  }

  btnContinuar.addEventListener('click', function () { location.replace(PROTEGIDA); });

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    btn.disabled = true;
    mostrar('info', 'Verificando acesso...');
    var r = await Auth.login(document.getElementById('usuario').value,
                             document.getElementById('senha').value);
    document.getElementById('senha').value = '';
    btn.disabled = false;

    if (r.status === 'ok') {
      if (r.aviso) {            // aviso diário: mostra e espera o usuário continuar
        form.hidden = true;
        mostrar('aviso', r.aviso);
        btnContinuar.hidden = false;
        btnContinuar.focus();
      } else {
        location.replace(PROTEGIDA);
      }
    } else if (r.status === 'expirado') {
      mostrar('erro', r.mensagem);
    } else {
      mostrar('erro', r.mensagem);
    }
  });
})();
</script>
</body>
</html>
